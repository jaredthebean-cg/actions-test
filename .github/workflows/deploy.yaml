name: Deploy to Chalk

on:
  workflow_run:
    workflows: ["Tag on PR Merge"]
    types: [completed]

jobs:
  deploy-to-chalk:
    runs-on: ubuntu-latest
    # Only run if triggered by workflow_run AND the tag workflow succeeded AND it ran on main
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          # Fetch all history of commits
          fetch-depth: 0
          fetch-tags: true
      - name: Print
        uses: ./.github/actions/print
        with:
          name: Deploy to Chalk
      - name: Print Github Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONEXT"